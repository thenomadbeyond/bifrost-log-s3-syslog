# Only needed if NO IAM role (IRSA / EKS Pod Identity / Workload Identity) is used.
# Do not commit real values - better use SealedSecrets/External Secrets or:
#   kubectl -n bifrost-logging create secret generic bifrost-s3-syslog-aws \
#     --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: bifrost-s3-syslog-aws
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
