apiVersion: v1
kind: ServiceAccount
metadata:
  name: bifrost-s3-syslog
  # EKS / IRSA: Rolle mit s3:ListBucket + s3:GetObject auf den Log-Bucket
  # (und s3:PutObject auf den State-Key, falls STATE_S3_URI genutzt wird)
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/bifrost-s3-syslog
automountServiceAccountToken: false
