apiVersion: v1
kind: ServiceAccount
metadata:
  name: bifrost-s3-syslog
  # EKS / IRSA: role with s3:ListBucket + s3:GetObject on the log bucket
  # (and s3:PutObject on the state key if STATE_S3_URI is used)
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/bifrost-s3-syslog
automountServiceAccountToken: false
