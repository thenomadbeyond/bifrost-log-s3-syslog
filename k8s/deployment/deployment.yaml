apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bifrost-s3-syslog-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # storageClassName: gp3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-s3-syslog
  labels: { app: bifrost-s3-syslog }
spec:
  replicas: 1                 # NEVER scale up - the state is not built for parallel instances
  strategy:
    type: Recreate            # old pod ends before the new one starts (no parallel run, RWO PVC)
  selector:
    matchLabels: { app: bifrost-s3-syslog }
  template:
    metadata:
      labels: { app: bifrost-s3-syslog }
    spec:
      serviceAccountName: bifrost-s3-syslog
      terminationGracePeriodSeconds: 60   # time to finish the running batch cleanly
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: shipper
          image: bifrost-s3-syslog
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: bifrost-s3-syslog }
            - secretRef: { name: bifrost-s3-syslog-aws, optional: true }
          env:
            - { name: RUN_MODE, value: "loop" }
            - { name: INTERVAL_SECONDS, value: "300" }
            - { name: STATE_DB, value: "/data/state.db" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }     # the whole log file is held in RAM while processing
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: state, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: bifrost-s3-syslog-state }
        - name: tmp
          emptyDir: {}
