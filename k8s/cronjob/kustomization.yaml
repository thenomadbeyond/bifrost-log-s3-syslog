# Variant B: CronJob every 5 minutes (RUN_MODE=once), state in S3
# kubectl apply -k k8s/cronjob
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bifrost-logging
components:
  - ../common
resources:
  - cronjob.yaml
images:
  - name: bifrost-s3-syslog
    newName: ghcr.io/OWNER/bifrost-s3-syslog   # adjust
    newTag: latest
