image:
  repository: ghcr.io/thenomadbeyond/bifrost-s3-syslog
  # empty = chart appVersion. On clusters with a disallow-latest policy set a fixed tag (vX.Y.Z / sha-...).
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Shipper environment variables (see README: Configuration). S3_BUCKET and SYSLOG_HOST are required.
config:
  S3_BUCKET: ""
  S3_PREFIXES: ""
  # S3_ENDPOINT_URL: http://garage.garage.svc:3900
  # S3_FORCE_PATH_STYLE: "true"
  # AWS_REGION: garage
  SYSLOG_HOST: ""
  SYSLOG_PORT: "514"
  SYSLOG_PROTOCOL: tcp
  SYSLOG_FRAMING: octet
  SYSLOG_APP_NAME: bifrost
  SYSLOG_HOSTNAME: bifrost-s3-syslog
  COMMIT_EVERY: "500"
  INTERVAL_SECONDS: "300"
  LOG_LEVEL: INFO

# Additional variables (list in env format, valueFrom is possible too)
extraEnv: []

# Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (existing Secret; empty = none, e.g. with IRSA)
existingSecret: ""

state:
  # s3: state in STATE_S3_URI (no PVC), pvc: state on a PersistentVolumeClaim
  type: s3
  # type s3: target, outside of config.S3_PREFIXES, e.g. s3://bucket/_shipper/state.db
  s3Uri: ""
  syncSeconds: 30
  pvc:
    size: 1Gi
    storageClass: ""
    existingClaim: ""

serviceAccount:
  annotations: {}   # z. B. eks.amazonaws.com/role-arn

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
