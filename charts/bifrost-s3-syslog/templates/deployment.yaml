apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "b3s.name" . }}
  labels: {{- include "b3s.labels" . | nindent 4 }}
spec:
  # NIE hochskalieren: der State ist nicht fuer parallele Instanzen gebaut
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "b3s.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "b3s.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "b3s.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: shipper
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "b3s.name" . }}}
            {{- if .Values.existingSecret }}
            - secretRef: {name: {{ .Values.existingSecret }}}
            {{- end }}
          {{- with .Values.extraEnv }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: state
          {{- if eq .Values.state.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Values.state.pvc.existingClaim | default (printf "%s-state" (include "b3s.name" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
